# 여러 operation을 포함하는 정상 설정
api_name: test_multi_op

target_system_key: TEST_ORACLE
target_jndi_name: jdbc/TEST

stop_on_operation_error: true
max_row_limit: 5000
data_dump: false
batch_size: 50

operations:
  - operation_name: delete_op
    action_type: DELETE
    sql: |
      DELETE FROM TB_TEST WHERE ID = :ID
    fields:
      - { data_field: ID, param: ID, type: STRING }

  - operation_name: insert_op
    action_type: INSERT
    commit_action: COMMIT
    commit_scope: ALL
    sql: |
      INSERT INTO TB_TEST (ID, NAME, AGE)
      VALUES (:ID, :NAME, :AGE)
    fields:
      - { data_field: ID,   param: ID,   type: STRING }
      - { data_field: NAME, param: NAME, type: STRING }
      - { data_field: AGE,  param: AGE,  type: INT    }

  - operation_name: select_op
    action_type: SELECT
    data_record: data
    sql: |
      SELECT ID, NAME, AGE FROM TB_TEST
      WHERE ID = :ID
    fields:
      - { data_field: ID,   param: ID,   type: STRING }
      - { data_field: NAME, param: NAME, type: STRING }
      - { data_field: AGE,  param: AGE,  type: INT    }
