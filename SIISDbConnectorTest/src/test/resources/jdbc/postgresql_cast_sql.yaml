# PostgreSQL :: 타입 캐스트 연산자가 포함된 SQL → :param 오탐 없이 검증 통과해야 함
api_name: test_postgresql_cast_sql
target_system_key: TEST_PG
target_jndi_name: jdbc/TEST
operations:
  - operation_name: select_with_cast
    action_type: SELECT
    data_record: data
    sql: |
      SELECT user_id::text AS uid, created_at::date AS cdate
      FROM tb_user
      WHERE status::text = :STATUS
        AND age::integer > :MIN_AGE
    fields:
      - { data_field: STATUS,  param: STATUS,  type: STRING, direction: IN }
      - { data_field: MIN_AGE, param: MIN_AGE, type: INT,    direction: IN }
      - { data_field: uid,     param: uid,     type: STRING }
      - { data_field: cdate,   param: cdate,   type: STRING }
