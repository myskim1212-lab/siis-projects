api_name: test_select_users

target_system_key: TEST_ORACLE
target_system_name: TEST_ORACLE
target_jndi_name: jdbc/TEST

stop_on_operation_error: true
stop_on_row_error: true
max_row_limit: 100000

data_record_path: /operations

date_formats:
  - yyyy-MM-dd
  - yyyyMMdd

timestamp_zone_strategy: UTC

timestamp_formats:
  - yyyy-MM-dd'T'HH:mm:ss.SSSXXX

timestamp_ntz_formats:
  - yyyy-MM-dd'T'HH:mm:ss.SSS
  - yyyy-MM-dd'T'HH:mm:ss
  - yyyy-MM-dd HH:mm:ss

operations:
  - operation_name: test_select_op
    action_type: SELECT
    data_record: data
    commit_action: COMMIT
    commit_scope: ALL
    sql: |
      SELECT USER_ID, USER_NAME, USER_AGE
      FROM TB_USER_TEST
      WHERE USER_ID = :USER_ID
    fields:
      - { data_field: USER_ID,   param: USER_ID,   type: STRING }
      - { data_field: USER_NAME, param: USER_NAME, type: STRING }
      - { data_field: USER_AGE,  param: USER_AGE,  type: INT    }
