# DELETE 에 commit_scope: ROW 설정 → 수정 후 허용됨 (UPDATE/DELETE도 ROW 허용 추가)
api_name: test_row_scope_delete_valid
target_system_key: TEST
target_jndi_name: jdbc/TEST
operations:
  - operation_name: delete_op
    action_type: DELETE
    data_record: data
    commit_scope: ROW
    commit_action: COMMIT
    sql: |
      DELETE FROM TB_USER WHERE USER_ID = :USER_ID
    fields:
      - { data_field: USER_ID, param: USER_ID, type: STRING }
