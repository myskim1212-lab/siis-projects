# SELECT 에 direction=OUT 필드 포함 (검증 테스트용 - 허용 안 됨)
api_name: test_select_with_out
target_system_key: TEST_ORACLE
target_jndi_name: jdbc/TEST

operations:
  - operation_name: test_select_out
    action_type: SELECT
    sql: |
      SELECT USER_ID, OUT_CODE FROM TB_USER WHERE USER_ID = :USER_ID
    fields:
      - { data_field: USER_ID,  param: USER_ID,  type: STRING }
      - { data_field: OUT_CODE, param: OUT_CODE, type: STRING, direction: OUT }
