# PROCEDURE action_type 에서 OUT direction 허용 (검증 통과해야 함)
api_name: test_procedure_out

target_system_key: TEST_ORACLE
target_jndi_name: jdbc/TEST

operations:
  - operation_name: call_proc
    action_type: PROCEDURE
    sql: |
      { CALL PROC_TEST(:IN_ID, :OUT_CODE, :OUT_MSG) }
    fields:
      - { data_field: IN_ID,    param: IN_ID,    type: STRING }
      - { data_field: OUT_CODE, param: OUT_CODE, type: STRING, direction: OUT }
      - { data_field: OUT_MSG,  param: OUT_MSG,  type: STRING, direction: OUT }
