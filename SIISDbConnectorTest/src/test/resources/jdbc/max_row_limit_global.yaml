# 전역 max_row_limit 명시 설정 검증용
api_name: test_global_max_row_limit

target_system_key: TEST_ORACLE
target_jndi_name: jdbc/TEST

max_row_limit: 5

operations:
  - operation_name: insert_op
    action_type: INSERT
    data_record: data
    commit_action: COMMIT
    commit_scope: ALL
    sql: |
      INSERT INTO TB_TEST (ID, NAME) VALUES (:ID, :NAME)
    fields:
      - { data_field: ID,   param: ID,   type: STRING }
      - { data_field: NAME, param: NAME, type: STRING }
