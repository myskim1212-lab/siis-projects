# bulk=true 를 INSERT 에 설정한 경우 → 검증 통과해야 함
api_name: test_bulk_insert_valid
target_system_key: TEST
target_jndi_name: jdbc/TEST
operations:
  - operation_name: insert_bulk_op
    action_type: INSERT
    data_record: data
    bulk: true
    chunk_commit_size: 500
    sql: |
      INSERT INTO TB_USER (USER_ID, USER_NAME) VALUES (:USER_ID, :USER_NAME)
    fields:
      - { data_field: USER_ID,   param: USER_ID,   type: STRING }
      - { data_field: USER_NAME, param: USER_NAME, type: STRING }
