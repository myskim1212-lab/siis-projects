# Operation 단위 max_row_limit 설정 검증용
# 전역 max_row_limit=10, 오퍼레이션 max_row_limit=2 (op 값이 우선)
api_name: test_operation_max_row_limit

target_system_key: TEST_ORACLE
target_jndi_name: jdbc/TEST

max_row_limit: 10

operations:
  - operation_name: insert_op_with_limit
    action_type: INSERT
    data_record: data
    commit_action: COMMIT
    commit_scope: ALL
    max_row_limit: 2
    sql: |
      INSERT INTO TB_TEST (ID, NAME) VALUES (:ID, :NAME)
    fields:
      - { data_field: ID,   param: ID,   type: STRING }
      - { data_field: NAME, param: NAME, type: STRING }

  - operation_name: insert_op_no_limit
    action_type: INSERT
    data_record: data
    commit_action: COMMIT
    commit_scope: ALL
    sql: |
      INSERT INTO TB_TEST2 (ID, NAME) VALUES (:ID, :NAME)
    fields:
      - { data_field: ID,   param: ID,   type: STRING }
      - { data_field: NAME, param: NAME, type: STRING }
