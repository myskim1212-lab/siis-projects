# SELECT 에 commit_scope: ROW 설정 → INSERT/UPSERT/UPDATE/DELETE만 허용하므로 검증 에러 발생해야 함
api_name: test_row_scope_select_invalid
target_system_key: TEST
target_jndi_name: jdbc/TEST
operations:
  - operation_name: select_op
    action_type: SELECT
    data_record: data
    commit_scope: ROW
    commit_action: COMMIT
    sql: |
      SELECT USER_ID FROM TB_USER WHERE USER_ID = :USER_ID
    fields:
      - { data_field: USER_ID, param: USER_ID, type: STRING, direction: INOUT }
