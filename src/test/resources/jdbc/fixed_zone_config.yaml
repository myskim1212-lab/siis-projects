# timestamp_zone_strategy=FIXED + fixed_zone_id 설정 검증용
api_name: test_fixed_zone

target_system_key: TEST_ORACLE
target_jndi_name: jdbc/TEST

timestamp_zone_strategy: FIXED
fixed_zone_id: "Asia/Seoul"

timestamp_formats:
  - yyyy-MM-dd'T'HH:mm:ss.SSSXXX

operations:
  - operation_name: test_op
    action_type: SELECT
    sql: SELECT ID FROM TB_TEST WHERE ID = :ID
    fields:
      - { data_field: ID, param: ID, type: STRING }
